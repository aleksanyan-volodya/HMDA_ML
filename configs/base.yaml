# Settings shared by every experiment.

# Seed for the CV split. Every CV score we compare is computed on the split it
# produces, so we just fix it here (actually changing it is refused unless
# the run is started with --allow-fold-change bahahhahahahhahahahaha).
# The value 42 is arbitrary and carries no meaning... Well, maybe it does, but we don't care.
fold_seed: 42

# Number of CV folds. 5 just because it's a commun thing to do and I don't see any reason to use other thing.
# 10 folds would train on 90% (slightly less pessimistic) at 2x the compute.
n_folds: 5

# Seeds for model randomness like bagging, feature subsampling.
# Averaging k independent runs divides the seed-to-seed variance by k (std by sqrt(k)):
model_seeds: [0, 1, 2, 3, 4]

# Which model to run. No default on purpose: every experiment file must say it.
model: null

# Feature transforms from src/features.py, applied in this order. Empty = the raw typed
# columns of src/data.py (what the LightGBM baseline used).
features: []

# Target encodings (src/target_encoding.py). They use labels, so they are computed inside
# each CV fold, not with the features above. Each entry: {column, parent, m}. Empty = none.
target_encode: []

# LightGBM: Library defaults are used for anything not listed.
lgbm_params:
  objective: binary
  metric: auc                  # used by early stopping
  learning_rate: 0.05 
  num_leaves: 63               # tree complexity: 2^6 - 1, lets a tree combine ~6 conditions (interactions)
  min_data_in_leaf: 100
  feature_fraction: 0.8        # each tree sees a random 80% of features: decorrelates trees
  bagging_fraction: 0.8        # each tree sees a random 80% of rows.
  bagging_freq: 1              # re-draw the row sample at every tree (0 would disable bagging)
  lambda_l2: 1.0               # mild L2 penalty on leaf values; 0 = none, the scale of gradients is ~1
  cat_smooth: 10               # pseudo-rows added to a category level's statistics before it is used
                               # in a split: higher = rare levels trusted less. 10 is the library default,
                               # written here so that tuning can change it
  # The settings below are at their LightGBM default values, written out so that tuning can
  # change them (reports/tuning.md says which ones matter).
  max_depth: -1                # -1 = no limit on tree depth (num_leaves alone bounds the tree)
  max_bin: 255                 # number of bins a numeric column is cut into before splitting
  lambda_l1: 0.0               # L1 penalty on leaf values
  extra_trees: false           # true = split thresholds drawn at random
  path_smooth: 0.0             # pulls a leaf's value towards its parent's: weight n / (n + path_smooth)
  min_data_per_group: 100      # rows a category level needs to be considered on its own
  cat_l2: 10.0                 # L2 penalty specific to category splits
  max_cat_to_onehot: 4         # categories with at most this many levels are split one level vs the rest
  deterministic: true
  force_row_wise: true         # required with deterministic, fixes the histogram algorithm choice
  verbosity: -1
lgbm_fit:
  max_rounds: 5000             # upper cap only 
                               # the search is expected to stop far earlier
  early_stopping_rounds: 200   # compute saver for the inner search: stop once the inner mean AUC has
                               # not improved for 200 trees
                               # at lr 0.05 that is a long plateau

# Logistic regression (model: logreg, src/cv.py LogRegModel).
logreg:
  C_grid: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0, 100.0]   # inverse penalty strength, one value per decade (the
                                                 # penalty acts multiplicatively). Chosen by inner CV; a best
                                                 # value at either end stops the run (the grid must be widened)
  l1_ratio_grid: [0.0]         # share of L1 in the penalty, chosen with C by the inner CV. 0 = pure L2 (lbfgs,
                               # the logreg.yaml run); 1 = pure L1 (lasso); between = elastic net. > 0 uses saga
  spline_knots: 5             # min, quartiles, max on the rank scale (quartile knots, as in notebook 02)
  max_iter: 2000               # upper cap for the solver; a fit that has not converged stops the run

# CatBoost (model: catboost, src/cv.py CatBoostModel). Starting values of TODO 7.6, not tuned.
catboost_params:
  loss_function: Logloss
  eval_metric: AUC             # the competition metric, used to pick the tree count
  learning_rate: 0.05          # same step size as the LightGBM, so tree counts are comparable
  depth: 6                     # CatBoost grows symmetric trees: depth 6 = 64 leaves, close to LightGBM's 63
  l2_leaf_reg: 3.0             # library default
  allow_writing_files: false   # no catboost_info/ folder in the repo
  logging_level: Silent        # no per-iteration output (the CV prints its own summary)
catboost_fit:
  max_rounds: 5000             # upper cap; hitting it stops the run
  early_stopping_rounds: 200   # same patience as LightGBM

# XGBoost (model: xgb, src/cv.py XGBModel). Starting values of TODO 7.7, not tuned.
xgb_params:
  objective: "binary:logistic"
  eval_metric: auc             # the competition metric, used to pick the tree count
  tree_method: hist            # histogram splits, like LightGBM
  eta: 0.05                    # learning rate, same as the LightGBM and CatBoost
  max_depth: 6                 # depth-wise trees, up to 64 leaves (LightGBM: 63 by default)
  subsample: 0.8               # share of rows per tree
  colsample_bytree: 0.8        # share of columns per tree
  min_child_weight: 10         # minimum hessian sum in a leaf: ~ at least 80 rows at p = 0.85
  lambda: 1.0                  # L2 penalty on leaf values (library default)
  max_cat_to_onehot: 64        # carried over from the LightGBM screening (+4.5 SE there): categories
                               # split one level at a time instead of grouped
xgb_fit:
  max_rounds: 5000             # upper cap; hitting it stops the run
  early_stopping_rounds: 200   # same patience as LightGBM and CatBoost

# ExtraTrees (model: extratrees, src/cv.py ExtraTreesModel). Nothing searched; checked once on a
# 30k-row sample of fold 0 (leaf 1 / 5 / 20 x 200 / 500 trees): leaf 1 best, 200 = 500 trees.
extratrees_params:
  n_estimators: 300            # more trees only reduce averaging noise; 200 and 500 scored the same
  min_samples_leaf: 1          # fully grown trees: best on the sample (0.888 vs 0.881 at 5, 0.867 at 20)
  max_features: sqrt           # random subset of sqrt(columns) per split (library default)
  bootstrap: false             # library default: every tree sees all rows (true = a bootstrap sample)
  max_depth: null              # library default: no depth limit, trees grow until min_samples_leaf
extratrees_fit:
  rank_numeric: false          # true = numeric columns replaced by their rank in [0, 1] before the forest
                               # (random thresholds then fall where the rows are, not in skewed tails)
