# The adopted LightGBM feature set (55 features), see "Results so far" in reports/feature_plan.md.
# Same content as lgbm_no_county_msa.yaml, under a name that says what it is.
# Reference run: 20261002T141818Z_f7f2dc68 (CV AUC 0.91695, LB 0.91850).
model: lgbm
features:
  # block 0, cleaning (adopted)
  - census_zero_to_nan
  - tract_income_zero_to_nan
  - housing_age_negative_to_nan
  - multifamily_levels
  - drop_derived_duplicates
  - dti_order
  - age_order
  # block 2, ratios (adopted)
  - computed_ltv
  - property_to_income
  # 4.3, raw county / MSA ids removed (adopted)
  - drop_county_msa_ids
