# TODO 7.24, last MLP run, for the report: mlp_combo.yaml with the schedule doubled. mlp_combo chose epochs 24 to 30 of
# 30, its inner AUC still at its peak when the schedule ended, so it may have been stopped by the budget.
# Reference: mlp_combo.yaml (run 20261031T115412Z_33a6dc74).
model: mlp
features:
  # block 0, cleaning (adopted)
  - census_zero_to_nan
  - tract_income_zero_to_nan
  - housing_age_negative_to_nan
  - multifamily_levels
  - drop_derived_duplicates
  - dti_order
  - age_order
  # block 2, ratios (adopted)
  - computed_ltv
  - property_to_income
  # 4.3, raw county / MSA ids removed
  - drop_county_msa_ids
mlp:
  max_epochs: 60
  dropout: 0.4
  weight_decay: 0.1
  numeric_bins: 8
  patience: 60                 # no early stop: the low-rate end of the cosine is what this schedule is for
