# TODO 7.22, elastic-net logistic regression: logreg.yaml with a mixed L1 + L2 penalty; C and the L1
# share chosen together by the same inner CV. Compared with the L2 run 20261013T154151Z_83e8fb23.
model: logreg
features:
  # block 0 cleaning; derived_* duplicates are KEPT (ready-made crossings for a linear model),
  # DTI and ages stay categorical (one-hot) instead of ranks
  - census_zero_to_nan
  - tract_income_zero_to_nan
  - housing_age_negative_to_nan
  - multifamily_levels
  # block 1 row states (rejected for trees, a linear model needs them)
  - exempt_code_count
  - entity_applicant
  - location_unknown
  - has_coapplicant
  - income_le_0
  # block 2 ratios
  - computed_ltv
  - property_to_income
  # block 3 segment and rule flags (rejected for trees)
  - manufactured_conventional
  - manufactured_location_unknown
  - dti_above_program_limit
  - ltv_at_standard_value
  # raw county / MSA ids out: county comes back as its smoothed rate below
  - drop_county_msa_ids
  # linear only
  - linear_bands
  - linear_crossings
  - linear_extra
target_encode:
  - {column: county_code, parent: state_code, m: 20}
logreg:
  # Interior mixes only: the two ends are the L2 run (0) and logreg_l1.yaml (1). Evenly spaced; 0.5 peaked
  # at 0.91033 on the timing split (L1 0.91004, L2 0.90969), so the differences are small.
  l1_ratio_grid: [0.25, 0.5, 0.75]
  C_grid: [0.01, 0.03, 0.1, 0.3, 1.0, 3.0]   # as logreg_l1.yaml (same timing evidence)
  max_iter: 5000               # as logreg_l1.yaml
