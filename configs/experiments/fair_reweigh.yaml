# Fair model, step 2 (reweighing, Kamiran and Calders 2012): fair_unaware.yaml trained with sample
# weights that make derived_race independent of the label in each fold's training part,
# w(g, y) = P(g) P(y) / P(g, y). derived_race only sets the weights; it is not a feature.
# One attribute keeps the weights moderate (about 0.3 to 1.6); sex, ethnicity and age are
# measured, not reweighed. Scoring stays unweighted, as for every other run.
model: lgbm
reweigh: derived_race
features:
- census_zero_to_nan
- tract_income_zero_to_nan
- housing_age_negative_to_nan
- multifamily_levels
- drop_derived_duplicates
- dti_order
- age_order
- computed_ltv
- property_to_income
- drop_county_msa_ids
- drop_process_artefacts
- drop_demographics
lgbm_params:
  num_leaves: 113
  min_data_in_leaf: 5
  feature_fraction: 0.5748992881034819
  bagging_fraction: 0.9485362062338821
  path_smooth: 14.649295564192302
  max_cat_to_onehot: 64
