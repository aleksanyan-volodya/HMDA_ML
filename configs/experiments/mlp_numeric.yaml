# TODO 7.24 variant, one change on top of the 30-epoch schedule of mlp_e30.yaml (reference: that run).
# Richer numeric inputs. The first run gave 228 inputs to the 38 categoricals and 19 to the 19 numerics, while
# LTV, DTI and income are the main predictors. 8 bins per column, the same order as the 7 spline columns
# of the logistic regression, which beats this net.
model: mlp
features:
  # block 0, cleaning (adopted)
  - census_zero_to_nan
  - tract_income_zero_to_nan
  - housing_age_negative_to_nan
  - multifamily_levels
  - drop_derived_duplicates
  - dti_order
  - age_order
  # block 2, ratios (adopted)
  - computed_ltv
  - property_to_income
mlp:
  max_epochs: 30
  numeric_bins: 8
  patience: 30                 # no early stop: the low-rate end of the cosine is what this schedule is for
