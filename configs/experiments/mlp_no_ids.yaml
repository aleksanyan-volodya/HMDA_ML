# TODO 7.24 variant, one change on top of the 30-epoch schedule of mlp_e30.yaml (reference: that run).
# Raw county and MSA ids removed. County's embedding is 60,000 of 377,196 parameters for 84,000 rows; raw ids
# hurt LightGBM (-0.009) and helped CatBoost, so the data cannot say which way a net goes.
model: mlp
features:
  # block 0, cleaning (adopted)
  - census_zero_to_nan
  - tract_income_zero_to_nan
  - housing_age_negative_to_nan
  - multifamily_levels
  - drop_derived_duplicates
  - dti_order
  - age_order
  # block 2, ratios (adopted)
  - computed_ltv
  - property_to_income
  # 4.3, raw county / MSA ids removed
  - drop_county_msa_ids
mlp:
  max_epochs: 30
  patience: 30                 # no early stop: the low-rate end of the cosine is what this schedule is for
