# XGBoost (TODO 7.7) on the adopted LightGBM feature set, starting values (base.yaml), untuned.
# Candidate for the final blend: kept only if it adds to LightGBM under the rule.
model: xgb
features:
  # block 0, cleaning (adopted)
  - census_zero_to_nan
  - tract_income_zero_to_nan
  - housing_age_negative_to_nan
  - multifamily_levels
  - drop_derived_duplicates
  - dti_order
  - age_order
  # block 2, ratios (adopted)
  - computed_ltv
  - property_to_income
  # 4.3, raw county / MSA ids removed (adopted)
  - drop_county_msa_ids
