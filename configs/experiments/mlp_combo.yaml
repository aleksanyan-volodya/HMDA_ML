# TODO 7.24: the changes that passed, combined (reference: mlp_no_ids.yaml). No raw ids, more regularisation, and the
# numeric bins, which reached a higher peak but overfitted fast, so they should gain most from the regularisation.
model: mlp
features:
  # block 0, cleaning (adopted)
  - census_zero_to_nan
  - tract_income_zero_to_nan
  - housing_age_negative_to_nan
  - multifamily_levels
  - drop_derived_duplicates
  - dti_order
  - age_order
  # block 2, ratios (adopted)
  - computed_ltv
  - property_to_income
  # 4.3, raw county / MSA ids removed
  - drop_county_msa_ids
mlp:
  max_epochs: 30
  dropout: 0.4
  weight_decay: 0.1
  numeric_bins: 8
  patience: 30                 # no early stop: the low-rate end of the cosine is what this schedule is for
