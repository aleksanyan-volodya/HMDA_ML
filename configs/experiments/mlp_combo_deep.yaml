# TODO 7.24: mlp_combo.yaml with the 4-layer net. mlp_small, mlp_deep and mlp_reg all limit memorisation, so they
# overlap: small and deep exclude each other and deep scored higher (+5.1 SE against +3.4). Risk: too much
# regularisation at once, the net underfits.
model: mlp
features:
  # block 0, cleaning (adopted)
  - census_zero_to_nan
  - tract_income_zero_to_nan
  - housing_age_negative_to_nan
  - multifamily_levels
  - drop_derived_duplicates
  - dti_order
  - age_order
  # block 2, ratios (adopted)
  - computed_ltv
  - property_to_income
  # 4.3, raw county / MSA ids removed
  - drop_county_msa_ids
mlp:
  max_epochs: 30
  dropout: 0.4
  weight_decay: 0.1
  numeric_bins: 8
  hidden: [128, 128, 128, 128]
  patience: 30                 # no early stop: the low-rate end of the cosine is what this schedule is for
