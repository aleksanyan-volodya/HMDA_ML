# TODO 7.24 variant, one change on top of the 30-epoch schedule of mlp_e30.yaml (reference: that run).
# More regularisation. In the first run the loss kept falling after epoch 10 while the inner AUC fell.
# weight_decay is multiplied by the learning rate at each step, so 0.01 was close to nothing.
model: mlp
features:
  # block 0, cleaning (adopted)
  - census_zero_to_nan
  - tract_income_zero_to_nan
  - housing_age_negative_to_nan
  - multifamily_levels
  - drop_derived_duplicates
  - dti_order
  - age_order
  # block 2, ratios (adopted)
  - computed_ltv
  - property_to_income
mlp:
  max_epochs: 30
  dropout: 0.4
  weight_decay: 0.1
  patience: 30                 # no early stop: the low-rate end of the cosine is what this schedule is for
