# TODO 7.24 variant, one change on top of the 30-epoch schedule of mlp_e30.yaml (reference: that run).
# Deeper and narrower. Same width as mlp_small, twice the layers: more steps to combine features (interactions
# are what trees find and the linear model misses), far fewer parameters than the first run.
model: mlp
features:
  # block 0, cleaning (adopted)
  - census_zero_to_nan
  - tract_income_zero_to_nan
  - housing_age_negative_to_nan
  - multifamily_levels
  - drop_derived_duplicates
  - dti_order
  - age_order
  # block 2, ratios (adopted)
  - computed_ltv
  - property_to_income
mlp:
  max_epochs: 30
  hidden: [128, 128, 128, 128]
  patience: 30                 # no early stop: the low-rate end of the cosine is what this schedule is for
